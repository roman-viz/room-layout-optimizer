<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Room layout optimizer" />
    <title>Roomize — Room layout optimizer</title>
    <script>
      (() => {
        const preference = localStorage.getItem('roomform-theme');
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = preference === 'dark' || ((preference === 'system' || !preference) && systemTheme);
        const theme = preference === 'light' ? 'light' : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
